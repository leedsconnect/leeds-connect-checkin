<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Leeds Connect Diwali 2026 - Check-in
  </title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f7f4fb;

      color: #222;
    }


    .container {

      max-width: 500px;

      margin: 0 auto;

      background: white;

      border-radius: 20px;

      padding: 25px 20px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,0.12);
    }


    /* =========================================
       LOGO
       ========================================= */

    .logo {

      text-align: center;

      margin-bottom: 12px;
    }


    .logo img {

      width: 150px;

      height: 150px;

      max-width: 100%;

      object-fit: contain;

      border-radius: 50%;
    }


    /* =========================================
       BRAND
       ========================================= */

    .brand {

      text-align: center;

      margin-bottom: 20px;
    }


    .brand-title {

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 5px;
    }


    .brand-tagline {

      font-size: 18px;

      font-weight: 700;
    }


    /* =========================================
       EVENT
       ========================================= */

    .event-title {

      text-align: center;

      font-size: 23px;

      font-weight: 800;

      margin-top: 25px;

      margin-bottom: 10px;
    }


    .event-info {

      text-align: center;

      line-height: 1.7;

      margin-bottom: 25px;

      color: #444;
    }


    /* =========================================
       SCANNER
       ========================================= */

    .scanner-box {

      border:
        2px dashed
        #6b2aa8;

      border-radius: 15px;

      padding: 20px;

      text-align: center;

      margin-bottom: 20px;
    }


    .scanner-title {

      font-size: 20px;

      font-weight: 700;

      margin-bottom: 10px;
    }


    .scanner-note {

      font-size: 14px;

      color: #666;

      margin-bottom: 15px;
    }


    #reader {

      width: 100%;

      margin: auto;
    }


    /* =========================================
       BUTTONS
       ========================================= */

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }


    .check-button {

      background: #6b2aa8;

      color: white;
    }


    .check-button:disabled {

      background: #aaa;

      cursor: not-allowed;
    }


    /* =========================================
       DIVIDER
       ========================================= */

    .divider {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 25px 0;

      color: #777;
    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background: #ddd;
    }


    /* =========================================
       MANUAL ENTRY
       ========================================= */

    .manual-title {

      font-size: 18px;

      font-weight: 700;

      margin-bottom: 10px;
    }


    input {

      width: 100%;

      padding: 14px;

      border:
        1px solid #ccc;

      border-radius: 9px;

      font-size: 17px;

      margin-bottom: 12px;
    }


    /* =========================================
       RESULT
       ========================================= */

    .result {

      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      line-height: 1.6;
    }


    .success {

      background: #e8f7ed;

      border:
        1px solid #4caf50;
    }


    .error {

      background: #fdeaea;

      border:
        1px solid #d32f2f;
    }


    .warning {

      background: #fff6df;

      border:
        1px solid #e0a800;
    }


    .registration-card {

      text-align: left;

      margin-top: 12px;

      line-height: 1.7;
    }


    .registration-card strong {

      color: #333;
    }


    /* =========================================
       FOOTER
       ========================================= */

    .footer {

      text-align: center;

      margin-top: 25px;

      font-size: 13px;

      color: #777;
    }


  </style>

</head>


<body>


<div class="container">


  <!-- ========================================
       LOGO
       ======================================== -->

  <div class="logo">

    <img
      src="Logo.jpeg"
      alt="Leeds Connect Logo"
    >

  </div>


  <!-- ========================================
       BRAND
       ======================================== -->

  <div class="brand">

    <div class="brand-title">
      Leeds Connect
    </div>

    <div class="brand-tagline">
      Bringing People Together
    </div>

  </div>


  <!-- ========================================
       EVENT
       ======================================== -->

  <div class="event-title">

    Leeds Connect Diwali 2026

  </div>


  <div class="event-info">

    📅 14 November 2026<br>

    ⏰ 15:00 – 22:00<br>

    📍 Aria Suite, Woodhouse St,<br>
    Woodhouse, Leeds LS6 2JH

  </div>


  <!-- ========================================
       QR SCANNER
       ======================================== -->

  <div class="scanner-box">


    <div class="scanner-title">

      📷 Scan Registration QR Code

    </div>


    <div class="scanner-note">

      Tap the button below and allow camera access.

    </div>


    <button
      type="button"
      id="scanButton"
      class="check-button"
      onclick="startScanner()"
    >

      📷 Open Camera & Scan QR

    </button>


    <div
      id="reader"
      style="margin-top:20px;"
    ></div>


  </div>


  <!-- ========================================
       DIVIDER
       ======================================== -->

  <div class="divider">

    OR

  </div>


  <!-- ========================================
       MANUAL REGISTRATION
       ======================================== -->

  <div class="manual-title">

    Enter Registration ID

  </div>


  <input
    type="text"
    id="registrationId"
    placeholder="Example: LCD26-00001"
    autocomplete="off"
  >


  <button
    id="checkButton"
    class="check-button"
    onclick="checkRegistration()"
  >

    Check Registration

  </button>


  <!-- ========================================
       RESULT
       ======================================== -->

  <div
    id="result"
    class="result">
  </div>


  <!-- ========================================
       FOOTER
       ======================================== -->

  <div class="footer">

    Leeds Connect Diwali 2026<br>

    Volunteer Check-in

  </div>


</div>


<script>


/* =================================================
   APPS SCRIPT WEB APP URL
   ================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxrDMxUztt-6b79War4qdJR216FzyZN8PJ7s2NP_RG6nP1QsHAx9HSmoqK6wmZTdrJrow/exec";


/* =================================================
   QR SCANNER VARIABLES
   ================================================= */

let html5QrCode = null;

let scannerRunning = false;


/* =================================================
   CLEAN QR CONTENT
   ================================================= */

function extractRegistrationId(value) {

  if (!value) {

    return "";
  }


  value =
    String(value).trim();


  /*
   * If QR contains:
   *
   * Leeds Connect | Registration ID=LCD26-00001
   *
   * extract only:
   *
   * LCD26-00001
   */


  const match =
    value.match(
      /Registration\s*ID\s*=\s*(LCD26-[A-Za-z0-9-]+)/i
    );


  if (match) {

    return match[1].trim();
  }


  /*
   * If QR contains only LCD26-00001
   */

  const directMatch =
    value.match(
      /(LCD26-[A-Za-z0-9-]+)/i
    );


  if (directMatch) {

    return directMatch[1].trim();
  }


  /*
   * Otherwise return original text
   */

  return value;
}


/* =================================================
   START QR SCANNER
   ================================================= */

function startScanner() {


  if (scannerRunning) {

    return;
  }


  const reader =
    document.getElementById("reader");


  reader.innerHTML = "";


  html5QrCode =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,


    function(decodedText) {


      /*
       * QR detected
       */

      const registrationId =
        extractRegistrationId(decodedText);


      document
        .getElementById("registrationId")
        .value =
        registrationId;


      stopScanner();


      /*
       * Automatically validate
       */

      checkRegistration();

    },


    function(errorMessage) {

      /*
       * QR not detected yet.
       * Continue scanning.
       */

    }

  )


  .then(function() {

    scannerRunning = true;

    document
      .getElementById("scanButton")
      .innerText =
      "📷 Scanning...";

  })


  .catch(function(error) {

    scannerRunning = false;

    showResult(

      "error",

      "❌ Unable to access the camera.<br><br>" +

      "Please allow camera access in your browser settings."

    );

  });

}


/* =================================================
   STOP QR SCANNER
   ================================================= */

function stopScanner() {


  if (
    html5QrCode &&
    scannerRunning
  ) {


    html5QrCode
      .stop()


      .then(function() {

        scannerRunning = false;

        document
          .getElementById("scanButton")
          .innerText =
          "📷 Open Camera & Scan QR";

      })


      .catch(function() {

        scannerRunning = false;

      });

  }

}


/* =================================================
   CHECK REGISTRATION
   ================================================= */

function checkRegistration() {


  let id =
    document
      .getElementById("registrationId")
      .value
      .trim();


  /*
   * Clean QR text in case somebody
   * manually pasted the QR contents.
   */

  id =
    extractRegistrationId(id);


  document
    .getElementById("registrationId")
    .value =
    id;


  if (!id) {

    showResult(

      "error",

      "❌ Please enter a Registration ID."

    );

    return;
  }


  showResult(

    "warning",

    "⏳ Checking registration..."

  );


  document
    .getElementById("checkButton")
    .disabled =
    true;


  /*
   * JSONP callback name
   */

  const callbackName =
    "registrationCallback_" +
    Date.now();


  /*
   * Create global callback
   */

  window[callbackName] =
    function(response) {


      try {

        handleValidationResponse(response);

      }

      finally {

        /*
         * Clean up callback
         */

        delete window[callbackName];

      }

    };


  /*
   * Build API URL
   */

  const url =
    API_URL +
    "?action=validate" +
    "&registrationId=" +
    encodeURIComponent(id) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
   * Create script tag.
   *
   * This avoids the cross-origin
   * fetch problem between GitHub
   * Pages and Apps Script.
   */

  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {


      delete window[callbackName];


      document
        .getElementById("checkButton")
        .disabled =
        false;


      showResult(

        "error",

        "❌ Unable to connect to the registration system.<br><br>" +

        "Please check your internet connection or try again."

      );

    };


  document
    .body
    .appendChild(script);


  /*
   * Safety timeout
   */

  setTimeout(function() {


    if (window[callbackName]) {


      delete window[callbackName];


      document
        .getElementById("checkButton")
        .disabled =
        false;


      showResult(

        "error",

        "❌ Registration system did not respond.<br><br>" +

        "Please try again."

      );

    }

  }, 15000);

}


/* =================================================
   VALIDATION RESPONSE
   ================================================= */

function handleValidationResponse(response) {


  document
    .getElementById("checkButton")
    .disabled =
    false;


  if (!response) {

    showResult(

      "error",

      "❌ No response received."

    );

    return;
  }


  /*
   * Registration not found
   */

  if (!response.success) {

    showResult(

      "error",

      "❌ " +
      escapeHtml(
        response.message ||
        "Registration not found."
      )

    );

    return;
  }


  const registration =
    response.registration;


  /*
   * Already checked in
   */

  if (response.alreadyCheckedIn) {


    showResult(

      "warning",

      "⚠️ <strong>ALREADY CHECKED IN</strong>" +

      "<div class='registration-card'>" +

      "<strong>Name:</strong> " +
      escapeHtml(registration.name) +

      "<br>" +

      "<strong>Registration ID:</strong> " +
      escapeHtml(registration.registrationId) +

      "<br>" +

      "<strong>Checked-in By:</strong> " +
      escapeHtml(registration.checkedInBy || "") +

      "<br>" +

      "<strong>Check-in Time:</strong> " +
      escapeHtml(registration.checkInTime || "") +

      "</div>"

    );

    return;
  }


  /*
   * Valid registration
   */

  showResult(

    "success",

    "✅ <strong>VALID REGISTRATION</strong>" +

    "<div class='registration-card'>" +

    "<strong>Name:</strong> " +
    escapeHtml(registration.name) +

    "<br>" +

    "<strong>Registration ID:</strong> " +
    escapeHtml(registration.registrationId) +

    "<br>" +

    "<strong>Adults:</strong> " +
    escapeHtml(registration.adults) +

    "<br>" +

    "<strong>Kids over 5:</strong> " +
    escapeHtml(registration.kidsOver5) +

    "<br>" +

    "<strong>Kids under 5:</strong> " +
    escapeHtml(registration.kidsUnder5) +

    "<br>" +

    "<strong>Veg Meals:</strong> " +
    escapeHtml(registration.vegMeals) +

    "<br>" +

    "<strong>Non-Veg Meals:</strong> " +
    escapeHtml(registration.nonVegMeals) +

    "</div>" +

    "<br>" +

    "<button " +

      "class='check-button' " +

      "onclick='performCheckIn()'>" +

      "✅ CHECK IN" +

    "</button>"

  );

}


/* =================================================
   ACTUAL CHECK-IN
   ================================================= */

function performCheckIn() {


  let id =
    document
      .getElementById("registrationId")
      .value
      .trim();


  id =
    extractRegistrationId(id);


  showResult(

    "warning",

    "⏳ Processing check-in..."

  );


  const callbackName =
    "checkinCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {


      try {

        handleCheckInResponse(response);

      }

      finally {

        delete window[callbackName];

      }

    };


  const url =
    API_URL +
    "?action=checkin" +

    "&registrationId=" +
    encodeURIComponent(id) +

    "&checkedInBy=" +
    encodeURIComponent("Volunteer") +

    "&notes=" +
    encodeURIComponent("") +

    "&callback=" +
    encodeURIComponent(callbackName);


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {


      delete window[callbackName];


      showResult(

        "error",

        "❌ Unable to connect to the check-in system."

      );

    };


  document
    .body
    .appendChild(script);


  setTimeout(function() {


    if (window[callbackName]) {


      delete window[callbackName];


      showResult(

        "error",

        "❌ Check-in system did not respond."

      );

    }

  }, 15000);

}


/* =================================================
   CHECK-IN RESPONSE
   ================================================= */

function handleCheckInResponse(response) {


  if (!response) {

    showResult(

      "error",

      "❌ No response received."

    );

    return;
  }


  if (!response.success) {


    if (response.alreadyCheckedIn) {


      showResult(

        "warning",

        "⚠️ <strong>ALREADY CHECKED IN</strong><br><br>" +

        escapeHtml(
          response.message
        )

      );

    }

    else {


      showResult(

        "error",

        "❌ " +

        escapeHtml(
          response.message ||
          "Check-in failed."
        )

      );

    }


    return;
  }


  const registration =
    response.registration;


  showResult(

    "success",

    "🎉 <strong>CHECK-IN SUCCESSFUL</strong>" +

    "<div class='registration-card'>" +

    "<strong>Name:</strong> " +

    escapeHtml(
      registration.name
    ) +

    "<br>" +

    "<strong>Registration ID:</strong> " +

    escapeHtml(
      registration.registrationId
    ) +

    "<br>" +

    "<strong>Adults:</strong> " +

    escapeHtml(
      registration.adults
    ) +

    "<br>" +

    "<strong>Kids over 5:</strong> " +

    escapeHtml(
      registration.kidsOver5
    ) +

    "<br>" +

    "<strong>Kids under 5:</strong> " +

    escapeHtml(
      registration.kidsUnder5
    ) +

    "<br>" +

    "<strong>Veg Meals:</strong> " +

    escapeHtml(
      registration.vegMeals
    ) +

    "<br>" +

    "<strong>Non-Veg Meals:</strong> " +

    escapeHtml(
      registration.nonVegMeals
    ) +

    "</div>"

  );


  /*
   * Clear registration field
   */

  document
    .getElementById("registrationId")
    .value = "";

}


/* =================================================
   RESULT DISPLAY
   ================================================= */

function showResult(type, message) {


  const result =
    document.getElementById("result");


  result.className =
    "result " + type;


  result.innerHTML =
    message;


  result.style.display =
    "block";


  result.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =================================================
   HTML ESCAPE
   ================================================= */

function escapeHtml(text) {


  return String(text || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


</script>


</body>

</html>
