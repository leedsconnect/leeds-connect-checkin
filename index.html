<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Leeds Connect Diwali 2026 - Check-in</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f7f4fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    /* =========================
       LEEDS CONNECT LOGO
       ========================= */

    .logo {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* =========================
       BRANDING
       ========================= */

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brand-tagline {
      font-size: 18px;
      font-weight: 700;
    }

    /* =========================
       EVENT
       ========================= */

    .event-title {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      margin-top: 25px;
    }

    .event-info {
      text-align: center;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    /* =========================
       QR SCANNER
       ========================= */

    .scanner-box {
      border: 2px dashed #6b2aa8;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .scanner-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .scanner-note {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    /* =========================
       DIVIDER
       ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #777;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    /* =========================
       MANUAL REGISTRATION
       ========================= */

    .manual-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 17px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .check-button {
      background: #6b2aa8;
      color: white;
    }

    /* =========================
       RESULTS
       ========================= */

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .success {
      background: #e8f7ed;
      border: 1px solid #4caf50;
    }

    .error {
      background: #fdeaea;
      border: 1px solid #d32f2f;
    }

    .warning {
      background: #fff6df;
      border: 1px solid #e0a800;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         LEEDS CONNECT LOGO
         ========================= -->

    <div class="logo">
      <img
        src="Logo.jpeg"
        alt="Leeds Connect Logo">
    </div>


    <!-- =========================
         BRANDING
         ========================= -->

    <div class="brand">

      <div class="brand-title">
        Leeds Connect
      </div>

      <div class="brand-tagline">
        Bringing People Together
      </div>

    </div>


    <!-- =========================
         EVENT TITLE
         ========================= -->

    <div class="event-title">
      Leeds Connect Diwali 2026
    </div>


    <div class="event-info">

      📅 14 November 2026<br>

      ⏰ 15:00 – 22:00<br>

      📍 Aria Suite, Woodhouse St,<br>
      Woodhouse, Leeds LS6 2JH

    </div>


    <!-- =========================
         QR SCANNER
         ========================= -->

    <div class="scanner-box">

      <div class="scanner-title">
        📷 Scan Registration QR Code
      </div>

      <div class="scanner-note">
        Tap the button below and allow camera access.
      </div>

      <button
        type="button"
        class="check-button"
        onclick="startScanner()">

        📷 Open Camera & Scan QR

      </button>

      <div
        id="reader"
        style="margin-top:20px;">
      </div>

    </div>


    <!-- =========================
         DIVIDER
         ========================= -->

    <div class="divider">
      OR
    </div>


    <!-- =========================
         MANUAL REGISTRATION
         ========================= -->

    <div class="manual-title">
      Enter Registration ID
    </div>


    <input
      type="text"
      id="registrationId"
      placeholder="Example: LCD26-00001"
      autocomplete="off"
    >


    <button
      class="check-button"
      onclick="checkRegistration()">

      Check Registration

    </button>


    <!-- =========================
         RESULT
         ========================= -->

    <div
      id="result"
      class="result">
    </div>


    <!-- =========================
         FOOTER
         ========================= -->

    <div class="footer">

      Leeds Connect Diwali 2026<br>

      Volunteer Check-in

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    function checkRegistration() {
    
      const id =
        document
          .getElementById("registrationId")
          .value
          .trim();
    
      if (!id) {
    
        showResult(
          "error",
          "Please enter a Registration ID."
        );
    
        return;
      }
    
      showResult(
        "warning",
        "Checking registration..."
      );
    
    
      const API_URL =
        "https://script.google.com/macros/s/AKfycbxrDMxUztt-6b79War4qdJR216FzyZN8PJ7s2NP_RG6nP1QsHAx9HSmoqK6wmZTdrJrow/exec";
    
    
      const url =
        API_URL +
        "?action=validate&registrationId=" +
        encodeURIComponent(id);
    
    
      fetch(url)
    
        .then(function(response) {
    
          if (!response.ok) {
    
            throw new Error(
              "Server returned " +
              response.status
            );
    
          }
    
          return response.json();
    
        })
    
        .then(function(data) {
    
          if (!data.success) {
    
            showResult(
              "error",
              "❌ " + data.message
            );
    
            return;
          }
    
    
          if (data.alreadyCheckedIn) {
    
            showResult(
              "warning",
              "⚠️ <strong>ALREADY CHECKED IN</strong><br><br>" +
              formatRegistration(data.registration)
            );
    
            return;
          }
    
    
          if (data.valid) {
    
            showResult(
              "success",
              "✅ <strong>VALID REGISTRATION</strong><br><br>" +
              formatRegistration(data.registration)
            );
    
            return;
          }
    
    
          showResult(
            "error",
            "❌ Registration could not be validated."
          );
    
        })
    
        .catch(function(error) {
    
          showResult(
            "error",
            "❌ Unable to connect to the registration system.<br><br>" +
            error.message
          );
    
        });
    
    }

    function formatRegistration(registration) {

      return (
    
        "<strong>Registration ID:</strong> " +
        escapeHtml(registration.registrationId) +
    
        "<br><br>" +
    
        "<strong>Name:</strong> " +
        escapeHtml(registration.name) +
    
        "<br>" +
    
        "<strong>Adults:</strong> " +
        escapeHtml(registration.adults) +
    
        "<br>" +
    
        "<strong>Kids over 5:</strong> " +
        escapeHtml(registration.kidsOver5) +
    
        "<br>" +
    
        "<strong>Kids under 5:</strong> " +
        escapeHtml(registration.kidsUnder5) +
    
        "<br>" +
    
        "<strong>Veg Meals:</strong> " +
        escapeHtml(registration.vegMeals) +
    
        "<br>" +
    
        "<strong>Non-Veg Meals:</strong> " +
        escapeHtml(registration.nonVegMeals)
    
      );
    
    }

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    
    }


    function showResult(type, message) {

      const result =
        document.getElementById("result");


      result.className =
        "result " + type;


      result.innerHTML =
        message;


      result.style.display =
        "block";

    }


    /* =========================
       QR CODE SCANNER
       ========================= */

    let html5QrCode = null;

    let scannerRunning = false;


    function startScanner() {

      if (scannerRunning) {
        return;
      }


      const reader =
        document.getElementById("reader");


      reader.innerHTML = "";


      html5QrCode =
        new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      html5QrCode.start(

        { facingMode: "environment" },

        config,


        function(decodedText) {

          scannerRunning = true;


          document
            .getElementById("registrationId")
            .value = decodedText;


          stopScanner();


          checkRegistration();

        },


        function(errorMessage) {

          /*
           * QR not detected yet —
           * keep scanning.
           */

        }

      )

      .then(function() {

        scannerRunning = true;

      })

      .catch(function(error) {

        scannerRunning = false;


        showResult(

          "error",

          "❌ Unable to access the camera.<br><br>" +

          "Please allow camera access in your browser settings."

        );

      });

    }


    function stopScanner() {

      if (
        html5QrCode &&
        scannerRunning
      ) {

        html5QrCode.stop()

          .then(function() {

            scannerRunning = false;

          })

          .catch(function() {

            scannerRunning = false;

          });

      }

    }

  </script>

</body>
</html>
